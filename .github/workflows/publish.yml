name: publish

on:
  push:
    tags: ["v*"]

jobs:
  call-wheels:
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read
      actions: write

  publish-pypi:
    name: Publish to PyPI
    needs: [call-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyqes
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "wheels-*"
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
          merge-multiple: true

      - name: List packages to publish
        run: ls -la dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
