name: wheels

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "native/**"
      - "pyQES/**"
      - "qes-core"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "overlays/vcpkg/**"
      - ".github/workflows/wheels.yml"
      - "ci/**"

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux* *-manylinux_i686 *-win32 pp*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"

          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y zip unzip tar curl ninja-build flex bison
            perl-core kernel-headers
            autoconf autoconf-archive automake libtool &&
            git clone --depth 1 https://github.com/microsoft/vcpkg /project/vcpkg &&
            /project/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          CIBW_BEFORE_BUILD_LINUX: >
            rm -rf /project/vcpkg/buildtrees /project/vcpkg/packages &&
            find /project/build -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          CIBW_ENVIRONMENT_LINUX: >
            VCPKG_FORCE_SYSTEM_BINARIES=1
            CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=/project/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_INSTALLED_DIR=/project/vcpkg_installed"

          CIBW_BEFORE_ALL_MACOS: >
            brew install autoconf autoconf-archive automake libtool
          CIBW_BEFORE_BUILD_MACOS: >
            rm -rf "$VCPKG_INSTALLATION_ROOT/buildtrees" "$VCPKG_INSTALLATION_ROOT/packages" &&
            find "$PWD/build" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=14.0
            CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_INSTALLED_DIR=$PWD/vcpkg_installed"

          CIBW_BEFORE_BUILD_WINDOWS: "python -m pip install delvewheel"
          # Forward-slash CMAKE_ARGS: backslashes in -D values are CMake escapes
          # (\a, \v, …) and can send vcpkg installs away from vcpkg_installed/.
          CIBW_ENVIRONMENT_WINDOWS: >
            VCPKG_DEFAULT_TRIPLET=x64-windows
            VCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed
            PATH="$GITHUB_WORKSPACE/vcpkg_installed/x64-windows/bin;$PATH"
            CMAKE_ARGS="$(python -c 'import os; from pathlib import Path; ws=Path(os.environ["GITHUB_WORKSPACE"]).as_posix(); root=Path(os.environ["VCPKG_INSTALLATION_ROOT"]).as_posix(); print(f"-DCMAKE_TOOLCHAIN_FILE={root}/scripts/buildsystems/vcpkg.cmake -DVCPKG_INSTALLED_DIR={ws}/vcpkg_installed")')"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
            python ci/repair_windows_wheel.py {dest_dir} {wheel}

          CIBW_TEST_COMMAND: >
            python -c "import pyQES._winds, pyQES._plume, pyQES._fire, pyQES._util; import pyQES; print(pyQES.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz
